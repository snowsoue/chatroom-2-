<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatroom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Welcome</h1>
      <p class="login-sub">Pick a name and avatar to join the chat.</p>

      <div class="avatar-picker">
        <div id="avatar-preview" class="avatar avatar-lg">?</div>
        <input type="file" id="avatar-file" accept="image/*" hidden>
        <div class="avatar-actions">
          <button id="avatar-upload-btn" class="btn-secondary" type="button">Upload photo</button>
          <button id="avatar-color-btn" class="btn-secondary" type="button">Random color</button>
        </div>
      </div>

      <input id="username-input" class="text-input" type="text" maxlength="32" placeholder="Username" autocomplete="off">
      <button id="join-btn" class="btn-primary">Join chat</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="app hidden">

    <!-- Channel sidebar -->
    <nav class="channel-sidebar">
      <div class="server-header">My Server</div>
      <div class="channel-list" id="channel-list"></div>
      <div class="user-panel">
        <div id="my-avatar" class="avatar avatar-sm">?</div>
        <div class="user-panel-info">
          <div id="my-username" class="user-panel-name">Username</div>
          <div class="user-panel-status">Online</div>
        </div>
        <button id="edit-profile-btn" class="icon-btn" title="Edit profile">&#9881;</button>
      </div>
    </nav>

    <!-- Main chat area -->
    <main class="chat-main">
      <header class="chat-header">
        <span class="chat-header-hash">#</span>
        <span id="channel-name" class="chat-header-name">general</span>
        <span id="channel-topic" class="chat-header-topic"></span>
      </header>

      <div id="messages" class="messages">
        <button id="load-more-btn" class="load-more-btn hidden">Load earlier messages</button>
        <div id="messages-inner"></div>
      </div>

      <div id="typing-indicator" class="typing-indicator"></div>

      <form id="message-form" class="message-form">
        <div id="image-preview-bar" class="image-preview-bar hidden">
          <img id="image-preview-img" src="" alt="preview">
          <button type="button" id="remove-image-btn" class="remove-image-btn" title="Remove image">&times;</button>
        </div>
        <div class="composer-row">
          <button type="button" id="attach-btn" class="icon-btn" title="Upload image">&#128206;</button>
          <input id="message-input" class="message-input" type="text" maxlength="2000"
                 placeholder="Message #general" autocomplete="off">
          <button type="button" id="emoji-btn" class="icon-btn" title="Emoji">&#128512;</button>
        </div>
        <input type="file" id="image-file-input" accept="image/*" hidden>
      </form>

      <!-- Emoji picker popover -->
      <div id="emoji-picker" class="emoji-picker hidden">
        <div class="emoji-picker-search">
          <input type="text" id="emoji-search" placeholder="Search emoji">
        </div>
        <div id="emoji-picker-body" class="emoji-picker-body"></div>
        <div class="emoji-picker-footer">
          <button type="button" id="create-emoji-btn" class="btn-secondary">+ Add custom emoji</button>
        </div>
      </div>
    </main>

    <!-- Members sidebar -->
    <aside class="member-sidebar">
      <div class="member-sidebar-title">Online — <span id="online-count">0</span></div>
      <div id="member-list" class="member-list"></div>
    </aside>

  </div>

  <!-- Custom emoji creation modal -->
  <div id="create-emoji-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Create custom emoji</h2>
      <input type="text" id="new-emoji-name" class="text-input" placeholder="emoji_name (letters, numbers, _)" maxlength="32">
      <input type="file" id="new-emoji-file" accept="image/*" class="text-input">
      <div class="modal-actions">
        <button type="button" id="cancel-emoji-btn" class="btn-secondary">Cancel</button>
        <button type="button" id="submit-emoji-btn" class="btn-primary">Create</button>
      </div>
    </div>
  </div>

  <!-- Image lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
